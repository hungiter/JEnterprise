version: '3.8'
services:
  api-gateway:
    build: api_gateway
    ports:
      - "8080:8080"
  user-service:
    build: ./user_service
    ports:
      - "8081:8081"
  tour-service:
    build: ./tour_service
    ports:
      - "8082:8082"
  guide-service:
    build: ./guide_service
    ports:
      - "8083:8083"
  # Recommendation service (Python)
  recommendation-service:
    build: ./recommendation-service
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
