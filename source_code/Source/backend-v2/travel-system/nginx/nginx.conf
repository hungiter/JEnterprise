events {}

http {

    proxy_set_header ngrok-skip-browser-warning true;
    server {
#         listen 80;
        listen 80;
        server_name ultimately-flowing-stag.ngrok-free.app;
        #proxy_set_header X-Internal-Secret $http_x_internal_secret; # Pass the header from client directly
        # Java API Gateway
        location /api/ {
            proxy_pass http://api-gateway:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            # Tăng timeout để không bị ngắt kết nối khi response lâu
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 30s;
            # Tăng kích thước buffer nếu response lớn
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            # Cho phép truyền dữ liệu lớn
            client_max_body_size 50M;

            # This ensures the header is sent to backend
            proxy_set_header ngrok-skip-browser-warning true;
        }

        # Java Users API
        location /users/ {
            proxy_pass http://user-service:8081/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
